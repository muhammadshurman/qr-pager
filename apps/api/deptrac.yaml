# The three named architecture guards from PLAN.md §3, row 2:
#
#   1. domain logic imports no framework or DB code  -> Domain depends on nothing
#   2. the platform layer imports no feature modules -> Platform's list omits Features
#   3. production code imports no test helpers       -> nothing may depend on TestHelpers
#
# "Proven to fail on a deliberately bad file" is not a claim made here: it is
# tests/Feature/Architecture/ArchitectureGuardTest.php, which runs deptrac against the
# fixtures in guard/fixtures/architecture and asserts it exits non-zero. Those fixtures
# are deliberately broken and live outside ./app, so this configuration never sees them
# and no autoloader maps them.
deptrac:
  # Kept out of the repo-root default (./.deptrac.cache), which went straight into
  # a commit the first time deptrac ran -- Task 0's bug 1 in §4a, verbatim: a new
  # tool cache must be verified with `git status` after. build/ is already ignored
  # for PHPStan's tmpDir, so the cache lives beside it rather than needing a second
  # ignore rule that the next tool will also need.
  cache_file: build/deptrac/deptrac.cache

  paths:
    - ./app
    - ./database
    - ./routes

  layers:
    # No framework, no DB. The enum registry and the status enums are the whole of it
    # today; the error-envelope type enum joins them in this task.
    - name: Domain
      collectors:
        - type: directory
          value: app/Domain/.*

    # Framework and DB, and it may not import a feature module. Models, providers,
    # controllers, factories and seeders all belong here: they are framework-coupled
    # application code, and the rule that matters for them is the same one.
    - name: Platform
      collectors:
        # Everything under app/Platform EXCEPT app/Platform/Auth, which is its own
        # layer below. A bool collector rather than a list of subdirectories, so a new
        # directory under app/Platform joins this layer automatically and only the one
        # named exception has to be maintained.
        - type: bool
          must:
            - type: directory
              value: app/Platform/.*
          must_not:
            - type: directory
              value: app/Platform/Auth/.*
        - type: directory
          value: app/Http/.*
        - type: directory
          value: app/Models/.*
        - type: directory
          value: app/Providers/.*
        - type: directory
          value: database/factories/.*
        - type: directory
          value: database/seeders/.*

    - name: Features
      collectors:
        - type: directory
          value: app/Features/.*

    # Wiring: it may reach anything, which is why it is a layer of its own rather than
    # being folded into Platform and widening Platform's rule.
    - name: Bootstrapping
      collectors:
        - type: directory
          value: database/migrations/.*
        - type: directory
          value: routes/.*

    # Third-party code. Named "Framework" for the rule it exists to express -- that our
    # own layers may depend on vendor code and vendor code depends on nothing of ours --
    # rather than for Laravel specifically. A vendor namespace missing from this list is
    # reported as an UNCOVERED dependency rather than as a violation, which is a quieter
    # failure: `Uncovered: 0` is the figure §4a records, so a new library has to be added
    # here or that figure moves. Minishlink (web-push) and GuzzleHttp (the PSR-18 client
    # behind it) joined at Task 4.
    - name: Framework
      collectors:
        - type: classLike
          value: ^(Illuminate|Laravel|Symfony|Monolog|Psr|Carbon|Dedoc|Laminas|Pest|PHPUnit|Faker|Mockery|Minishlink|GuzzleHttp)\\.*

    # DELIBERATELY REPURPOSED AT TASK 5, not deleted. QRPAGER-12 §6 required any rule
    # that existed only to contain the pre-Task-5 stub to be "either removed or
    # repurposed deliberately -- not left pointing at a class that no longer exists".
    #
    # The stub is gone. The layer stays, renamed, because the rule it expressed turns out
    # to be the right rule for the REAL auth layer too: Features may not import
    # app/Platform/Auth. A feature module must not reach into the resolver, the membership
    # reader or the device-token helper; it speaks to the TenantResolver interface in
    # Platform, to the enums in Domain, and to Gate/auth() in Framework. That keeps "which
    # tenant is this request" answerable in exactly one place, which is the property
    # RequireTenantScope's docblock depends on.
    #
    # So this is not the old rule surviving by inertia: the old rule said "nothing may be
    # built on a stub that is about to vanish", and this one says "the auth layer has one
    # entry point". The second is worth more than the first and is why the layer was kept.
    - name: Auth
      collectors:
        - type: directory
          value: app/Platform/Auth/.*

    # Rule 3. Test helpers are a layer so that "production code imports no test
    # helpers" is a dependency rule rather than a convention -- and so that the
    # pre-Task-5 auth stub cannot quietly become a production dependency (B5).
    - name: TestHelpers
      collectors:
        - type: classLike
          value: ^Tests\\.*

  ruleset:
    Domain: ~
    Platform:
      - Domain
      - Framework
      - Auth
    Auth:
      - Domain
      - Platform
      - Framework
    Features:
      - Domain
      - Platform
      - Framework
    Bootstrapping:
      - Domain
      - Platform
      - Features
      - Framework
    Framework: ~
    TestHelpers: ~
