name: qr-pager

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrpager_root
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: qrpager
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_connections=on
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrpager_root -d qrpager"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
