name: qr-pager

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrpager_root
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: qrpager
    # R-004: log_statement=all WAS here, cluster-wide, and Task 3 is the task that made
    # it untenable -- from here on every statement that stores or looks up a QR token
    # binds its sha256, so a cluster that logs every statement writes tenant data into a
    # log nobody redacts. The raw token never reaches Postgres at all (only the hash
    # does), so this was never the §4 "never logged" clause; it was the hash, which R-004
    # recorded as "not a credential, but tenant data in a log nobody redacts".
    #
    # NOTHING DEPENDED ON IT, which is why removing it is the whole fix rather than half
    # of one. The two places that need statement logging turn it on themselves and scope
    # it: BootstrapLoggingTest issues `alter database ... set log_statement = 'all'` and
    # resets it in a finally, and CI has its own `alter system set log_statement = 'all'`
    # step before the suite ("Log every statement, so the scan below cannot pass
    # vacuously"). So neither the in-suite R-009 assertion nor CI's whole-run verifier
    # scan loses anything here.
    #
    # R-004's review-by also assigns Task 4 "scopes the setting per-session rather than
    # cluster-wide". That half is DISSOLVED rather than deferred: with no cluster-wide
    # value there is nothing to scope, and Task 4's "the polling endpoint touches zero
    # Postgres queries" proof has the instrument Task 2 already used for the same claim --
    # a query listener over a real request (ReadinessCarrierTest) -- or it turns logging
    # on for its own window the way BootstrapLoggingTest does.
    #
    # log_connections stays: it logs who connected, not what they ran.
    command:
      - postgres
      - -c
      - log_connections=on
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrpager_root -d qrpager"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The pinned runtime (Q7), behind a profile so `docker compose up -d` still starts
  # only Postgres and Redis -- the suite needs those two and nothing else, and building
  # an image to run `php artisan test` would be a gate that depends on a Docker build.
  #
  # Start it with: docker compose --profile app up -d --build frankenphp
  frankenphp:
    profiles: ["app"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      # Octane's worker bootstrap reads this and refuses to start without it
      # ("Cannot find application base path", exit 11).
      APP_BASE_PATH: /app
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      LOG_CHANNEL: stderr
      # `postgres` and `redis`, not 127.0.0.1: inside the compose network the service
      # names are the hosts.
      DB_HOST: postgres
      DB_DATABASE: qrpager
      DB_USERNAME: qrpager_app
      DB_PASSWORD: local_dev_only
      DB_SSLMODE: disable
      REDIS_HOST: redis
      # The boot check refuses a serving process that can resolve owner or root
      # credentials (D9), so this task definition carries none -- which is the shape a
      # real one has to have. Migrations and db:bootstrap run as their own processes.
    ports:
      # The host port is configurable because 8080 is a popular port and a proof that
      # cannot bind is a proof nobody runs. The container port is fixed: it is the
      # Caddyfile's.
      - "127.0.0.1:${DRAIN_PORT:-8099}:8080"
    volumes:
      # The drain proof's slow route, mounted read-only and never committed. See
      # apps/api/docker/drain/routes.php for why it is a mount and not a route.
      - ./apps/api/docker/drain/routes.php:/app/routes/drain.php:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No restart policy and no healthcheck: the drain proof reads this container's EXIT
    # CODE after SIGTERM, and a restart policy would start it again before the proof
    # could look.

volumes:
  pgdata:
