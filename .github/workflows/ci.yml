name: CI

on:
  push:
    # Task branches as well as main, added 2026-10-26. Until now CI triggered on pushes
    # to main, on task-* TAGS, and on pull requests -- so a task branch produced NO
    # VERDICT AT ALL until the moment its PR opened. `task-2-api-core` reached thirty
    # commits that way.
    #
    # That makes R-001's working rule unperformable in the only window where it is cheap
    # to act on: "never merge until both required checks are green" cannot be followed
    # against a verdict that does not exist yet, and discovering a CI-only failure when
    # the PR opens means discovering it publicly, after the work is finished, instead of
    # on the commit that caused it. This branch had two such failures (see
    # docs/tickets/QRPAGER-9-progress.md) and neither could have been seen before the PR.
    #
    # The tag trigger stays: it is what gives the completion tag its own verdict in its
    # own concurrency group, which is how the task-1 cancellation was diagnosed.
    #
    # ⚠ EVERY PUSHED BRANCH, as of 2026-10-28, and `task-*` was not enough. The pattern above
    # was `[main, 'task-*']`, and `infra-local-mail-and-object-store` -- a branch carrying two
    # commits, one of them a test that fails when its service is absent -- matched neither, so
    # NOTHING RAN ON IT. Measured: `gh run list --branch infra-local-mail-and-object-store`
    # returns no rows, while the same command for `task-6-provisioning` returns a run per
    # commit. The first verdict on either commit would have arrived on the pull request into
    # main: after the work, in public, which is the exact condition this trigger was widened
    # on 2026-10-26 to remove. It was removed for `task-*` and left for every other name.
    #
    # A green local gate and a green CI are two different claims, and this is the second one
    # being ABSENT rather than failing -- which looks identical to "no news" on a branch page.
    # `PLAN.md R-126`, and `composer guard` rule 9 now fails if any branch pattern here can
    # exclude a pushed branch, so the hole cannot be reintroduced quietly.
    #
    # The tag trigger below is unaffected, and so is `pull_request`.
    branches: ['**']
    tags: ['task-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches only -- never on main, never on a tag.
  #
  # With this true everywhere, a push to main cancelled the run that was about to
  # verify the PREVIOUS push to main, so a commit followed quickly by another never
  # got a verdict at all. That is what happened at the task-1 merge: 3fe10c2 is green
  # on refs/tags/task-1 (a different concurrency group, so nothing cancelled it) and
  # not green on refs/heads/main, with byte-identical code. R-001's working rule --
  # "never merge until both required checks are green" -- is the entire reason an
  # unenforced main was accepted, and it cannot be performed against a verdict that
  # never arrives (PLAN.md R-001, §4a 2026-10-26).
  #
  # The CI-minute saving is kept where it was meant to apply: a pull_request run has
  # github.ref = refs/pull/N/merge, so it still cancels its own superseded runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tar.gz
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --no-banner --redact

  gates:
    name: Pint, PHPStan, Pest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: qrpager_test
      DB_USERNAME: qrpager_app
      DB_PASSWORD: local_dev_only
      DB_OWNER_USERNAME: qrpager_owner
      DB_OWNER_PASSWORD: local_dev_only
      DB_WORKER_USERNAME: qrpager_worker
      DB_WORKER_PASSWORD: local_dev_only
      DB_ROOT_USERNAME: qrpager_root
      DB_ROOT_PASSWORD: local_dev_only
      DB_MAINTENANCE_DATABASE: postgres
      # The service container has no TLS; config/database.php defaults to require.
      DB_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qrpager_root
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: qrpager_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qrpager_root -d qrpager_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, mbstring, intl, bcmath, gd, curl, zip, xml
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: composer pint

      - run: composer stan

      # The three named architecture guards (PLAN.md §3, row 2). Proven to fail on a
      # deliberately bad file by tests/Feature/Architecture/ArchitectureGuardTest.php,
      # which runs this same config against the fixtures in guard/fixtures/architecture.
      - run: composer deptrac

      # C1 and C2, enforced mechanically rather than by review (§4 › Postgres traps).
      # Proven to fail on a deliberately bad file by
      # tests/Feature/Architecture/RepoGuardTest.php against guard/fixtures/repo.
      - run: composer guard

      # The OpenAPI document is GENERATED from the routes and committed, so the only way
      # it can be wrong is by being stale -- and a stale generated file is the quietest
      # kind of wrong, because nothing fails and the file looks plausible. This step
      # re-exports and diffs (§6.2's third shared contract). Proven to fail on a
      # modified spec by tests/Feature/Http/OpenApiSpecTest.php.
      - run: composer openapi:check

      # Task 7's block schema, the SAME MECHANISM one contract over: docs/contracts/
      # landing-page.schema.json is generated from App\Domain\Landing\BlockSchema and is
      # what Task 11's renderer will consume, so there is no second definition of a block
      # anywhere. Proven to fail on a modified artifact by
      # tests/Feature/Landing/LandingSchemaContractTest.php.
      - run: composer landing:check

      # ⚠ THIS STEP WAS MISSING, and the comment in the `frontend` job below asserted it was
      # here. Task 8a's generated TS status mirror is the PHP-SOURCED half of §6.2: the enum
      # registry in `apps/api/app/Domain` is its one source, `php artisan contracts:export`
      # emits `packages/contracts/src/generated/status.ts`, and this byte-diffs the committed
      # file against what the enums produce right now. It is the only one of this task's five
      # generated artefacts whose source is PHP, so it belongs in this job and nowhere else
      # -- and it ran in `apps/api/bin/gate` and on no runner.
      #
      # `tools/gate/test/ci-parity.test.mjs` now covers THIS job against `apps/api/bin/gate`
      # in both directions, so the hole cannot reopen quietly. Proven to fail with the step
      # removed.
      - run: composer contracts:check

      - name: Bootstrap roles and the database
        run: php artisan db:bootstrap

      - name: Migrations apply clean from empty, twice
        run: |
          php artisan migrate --database=pgsql_owner --force
          php artisan migrate --database=pgsql_owner --force | tee /tmp/second.txt
          grep -q "Nothing to migrate" /tmp/second.txt

      # Proven here rather than locally: rollback under FORCE RLS as a non-superuser
      # owner is exactly the kind of thing that works on a developer's machine and
      # fails on a clean one (QRPAGER-1, gate amendment).
      - name: Rollback runs clean and a re-apply returns the identical schema
        run: |
          fingerprint() {
            PGPASSWORD=local_dev_only psql -h 127.0.0.1 -U qrpager_root -d qrpager_test \
              -q -f database/schema-fingerprint.sql
          }
          fingerprint > /tmp/schema-before.txt
          wc -l /tmp/schema-before.txt

          php artisan migrate:rollback --database=pgsql_owner --force

          remaining=$(PGPASSWORD=local_dev_only psql -h 127.0.0.1 -U qrpager_root -d qrpager_test -tAc \
            "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r'")
          echo "tables left after rollback: $remaining (expected 1, the migrations table)"
          test "$remaining" = "1"

          php artisan migrate --database=pgsql_owner --force
          fingerprint > /tmp/schema-after.txt
          diff -u /tmp/schema-before.txt /tmp/schema-after.txt
          echo "schema identical after rollback and re-apply"

      # "Boot refuses an unsafe DB role (exit 1, reason logged)" as a real process with
      # a real exit code, which is the only way an exit code can be checked. APP_DEBUG
      # is forced false because §4 forbids it outside `local` and .env.example ships it
      # true -- the refusal is correct and would make this step fail for the wrong reason.
      - name: Boot checks pass for a correctly configured process
        run: APP_DEBUG=false php artisan boot:check

      - name: Boot refuses a process that can resolve owner credentials
        run: |
          set +e
          APP_ENV=production APP_DEBUG=false DB_OWNER_PASSWORD=present php artisan boot:check
          code=$?
          set -e
          echo "boot:check exited $code (expected 1)"
          test "$code" = "1"

      # R-009, the half the in-suite assertion cannot cover. The container-log case in
      # BootstrapLoggingTest can only see tests that ran BEFORE it, because Pest's file
      # order is deterministic and that file is early. Here the whole run is inside the
      # window, so a verifier leaked by any test at all is caught.
      #
      # ALTER SYSTEM rather than ALTER DATABASE: the in-suite cases set and RESET the
      # database-level value in their own finally, which would undo a database-level
      # setting partway through the run.
      # 'ddl' AND NOT 'all' (security L-4). `log_statement = 'all'` put every statement in
      # the runner's Postgres log WITH ITS BOUND PARAMETERS -- including
      # `insert into pager_sessions (... token_hash ...) values (..., decode(?, 'hex'), ...)`
      # and `resolve_pager_token(decode(?, 'hex'))`, so a run's worth of QR token hashes was
      # written to a log on the default path. That is `§4 › Data`'s clause verbatim one step
      # removed, and `R-059` is the row.
      #
      # The scan below needs the ALTER ROLE statements and nothing else: its subject is a
      # role VERIFIER (`SCRAM-SHA-256$...`), which reaches a log only as the text of an
      # `ALTER ROLE ... PASSWORD`. That is DDL. Measured on 2026-10-27 against the composed
      # Postgres 16: with `log_statement = 'ddl'`, an `ALTER ROLE ... PASSWORD 'SCRAM-...'`
      # appears in the log (1 line) while a prepared SELECT and its bound parameter appear
      # **zero** times.
      #
      # So the positive control `R-036` asks for is kept in full and the token hashes are
      # gone -- strictly narrower, not weaker. A step that genuinely needs 'all' sets it
      # itself, in its own job, and resets it; it is never the default path.
      - name: Log DDL, so the verifier scan below cannot pass vacuously
        run: |
          PGPASSWORD=local_dev_only psql -h 127.0.0.1 -U qrpager_root -d qrpager_test -q \
            -c "alter system set log_statement = 'ddl'" -c "select pg_reload_conf()"

      # Mailpit (`R-125`) and the object store (`ADR-004`) come from the project's own
      # compose file rather than from `services:` above, and the reason is mechanical: a
      # GitHub Actions service container takes an image and `options:` and CANNOT take a
      # command line, while `objectstore` needs `server -s3 -dir=/data`. The runtime job
      # below already starts Postgres and Redis this way, so this is the established form
      # here rather than a new one.
      #
      # It also means CI cannot drift from what a clone gets: the image, the pinned tag, the
      # published ports, the credentials and the healthchecks have ONE source. `--wait`
      # blocks on those healthchecks, so the suite cannot race a starting service.
      #
      # WITHOUT THIS STEP THE SUITE IS RED HERE AND GREEN LOCALLY. LocalMailCatcherTest and
      # LocalObjectStoreTest both fail rather than skip when their service is absent, which
      # is the property they exist for -- 3 of 5 cases each, `cURL error 7` and
      # `Connection refused`. CI had never evaluated either: pushes to this branch trigger
      # nothing (`on.push.branches` is `main` and `task-*`), so the first verdict would have
      # arrived on the PR into main, which is the shape `R-001` and the 2026-10-26 trigger
      # change exist to prevent.
      #
      # Postgres and Redis stay as service containers above: they are up before the job's
      # first step, and their provenance difference from `compose.yaml` is already recorded
      # (`R-059` -- CI reads no compose command line, which is why no test asserts one).
      - name: The local mail catcher and object store, from the project's own compose file
        working-directory: .
        run: docker compose -f compose.yaml up -d --wait mailpit objectstore

      # ================================================================================
      # apps/api's OWN FRONT-END TOOLCHAIN, AND WHY THE PHP JOB SUDDENLY NEEDS NODE
      # ================================================================================
      #
      # Task 8b registers `->viteTheme('resources/css/filament/<panel>/theme.css')` on both
      # panel providers. `Panel::viteTheme()` resolves that path through `app(Vite::class)`,
      # i.e. through `public/build/manifest.json` -- which is git-ignored. So from 8b onward
      # EVERY TEST THAT RENDERS A PANEL PAGE needs the assets built first.
      #
      # MEASURED locally with `public/build` moved aside: `PlatformPanelAccessibilityTest`
      # went from 13 passed to **7 failed, 6 passed**, and every failure was a generic 500
      # problem+json body -- `{"title":"The request could not be completed.","status":500}` --
      # in tests about tabindex, badges and empty-state copy. Not one of them named the
      # cause. That is why this is a step and not a note in a README.
      #
      # This is apps/api's SECOND npm tree (ADR-003 keeps it out of the pnpm workspace), so
      # it is `npm ci` from `apps/api/package-lock.json` and not pnpm. `--ignore-scripts`
      # matches `composer setup`.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # The same hazard the `frontend` job documents at length, for the same reason:
          # setup-node v5 caches automatically when a `packageManager` field is present, and
          # the ROOT package.json carries `pnpm@12.16.1` -- so the action would resolve pnpm
          # to compute a cache path, in a job where corepack never runs, and fail with
          # `Unable to locate executable file: pnpm`. apps/api/package.json has no
          # packageManager field of its own, which is exactly why the root one is reached.
          package-manager-cache: false

      - name: Install apps/api's npm tree, with its lockfile as the authority
        run: npm ci --ignore-scripts

      # Builds the two panel themes AND checks the manifest names every theme the panel
      # providers register -- which a successful build does NOT do, because dropping a theme
      # from `vite.config.js`'s input array still builds. Proven: with the studio theme
      # removed from that array the build reported success and this step exited 1.
      - run: composer assets

      - name: Tests against real Postgres and Redis, Mailpit and the object store
        run: php artisan test

      - name: No role verifier reached the Postgres log, across the whole run
        run: |
          docker logs ${{ job.services.postgres.id }} > /tmp/pg.log 2>&1
          found=$(grep -c 'SCRAM-SHA-256' /tmp/pg.log || true)
          echo "SCRAM-SHA-256 occurrences in the Postgres log: $found (expected 0)"
          if [ "$found" != "0" ]; then
            grep -n 'SCRAM-SHA-256' /tmp/pg.log | head -5 | sed 's/SCRAM-SHA-256\$[^ ]*/SCRAM-SHA-256$[redacted]/g'
            exit 1
          fi
          PGPASSWORD=local_dev_only psql -h 127.0.0.1 -U qrpager_root -d qrpager_test -q \
            -c "alter system reset log_statement" -c "select pg_reload_conf()"

      - name: Unit coverage on the code this branch adds
        run: php artisan test --coverage --min=90

  frontend:
    name: Frontend workspace — lint, types, Vitest, Playwright, build
    runs-on: ubuntu-latest

    # ADR-003: "CI gains a second job for the frontend workspace." A SECOND JOB and not a
    # step in `gates`, for two reasons. It needs neither Postgres nor Redis, so bolting it on
    # would make every frontend failure wait for a database to come up; and a PHP failure and
    # a TypeScript failure must be distinguishable at a glance on the branch page, which is
    # the same argument apps/api/bin/gate's header makes about one log for both halves.
    #
    # The gate itself is `pnpm gate` (tools/gate/bin/gate.mjs), the sibling of
    # apps/api/bin/gate. The steps below are listed individually rather than calling it,
    # because GitHub's UI then names the failing step -- `pnpm gate` is the form for a human
    # at a terminal, who gets one readable log file instead.

    steps:
      - uses: actions/checkout@v5

      # ⚠ THE NODE VERSION COMES FROM .nvmrc, NEVER FROM A LITERAL HERE.
      #
      # QRPAGER-15 §7.4: a version verified in a session and not written down is a version
      # the next fresh clone does not get. Two sources for the Node version -- one in
      # .nvmrc for a developer and one hard-coded in this file for CI -- is the duplicated
      # -list shape this project has already paid for twice (QA H-1, and guard rule 11c,
      # which parses ThemeTokens rather than copying it). `node-version-file` makes .nvmrc
      # the only place the number appears.
      #
      # The floor is Vitest 5's, not Next's: vitest's engines field is
      # `^22.12.0 || ^24.0.0 || >=26.0.0`, which excludes Node 23 and 25, while next@15.5.28
      # asks only for >=20. package.json's `engines` states the same floor and .npmrc sets
      # engine-strict, so a clone on Node 20 is refused at install rather than failing later
      # somewhere that does not name the cause.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # ⚠ THE ONE LINE THE JOB FAILED FOR, AND IT IS A DEFAULT RATHER THAN SOMETHING
          # ANYONE WROTE.
          #
          # setup-node **v5.0.0** made dependency caching AUTOMATIC when `package.json`
          # carries a valid `packageManager` field -- read from the action's own action.yml:
          # `package-manager-cache` has `default: true`, described as "disable automatic
          # caching based on the package manager field in package.json". Ours is
          # `"packageManager": "pnpm@12.16.1"`, so the action resolved pnpm to compute the
          # cache directory and failed:
          #
          #     Resolved .nvmrc as 22
          #     Found in cache @ /opt/hostedtoolcache/node/22.23.4/x64
          #     Error: Unable to locate executable file: pnpm.
          #
          # pnpm does not exist yet at that point: corepack provisions it in the NEXT step.
          # The `cache:` input is deliberately unset and always was -- this was never a line
          # in the file, which is why grepping for `cache:` found nothing and why the first
          # diagnosis of this failure was wrong.
          #
          # The store is cached explicitly below instead, AFTER corepack, which is the only
          # order in which the path can be resolved. v6.0.0 narrowed the automatic caching
          # to npm only, so a future bump to v6 would also remove this hazard -- but v6 runs
          # on node24 and needs a runner >= 2.327.1, which is a separate decision.
          package-manager-cache: false

      - name: pnpm, at the version package.json pins
        # corepack reads "packageManager": "pnpm@12.16.1" from package.json, so the version
        # is not repeated here either.
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # THE PNPM STORE CACHE, AND WHY IT IS A SEPARATE STEP RATHER THAN setup-node's OWN
      # `cache: pnpm` INPUT. That input makes the action shell out to `pnpm store path` to
      # find the directory to cache -- and it runs as part of setup-node, which is BEFORE
      # corepack has put pnpm on the runner. So the convenient form cannot work in a
      # corepack-provisioned job at all; the store path has to be resolved after pnpm
      # exists, which is here.
      #
      # It also keeps the pnpm version single-sourced: nothing in this job names a version,
      # and `corepack prepare --activate` reads `packageManager` from package.json.
      - name: Resolve the pnpm store path, now that pnpm exists
        run: echo "STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install, with the lockfile as the authority
        # --frozen-lockfile so CI cannot silently resolve a different tree than the one that
        # was verified. A lockfile that disagrees with package.json fails here, which is the
        # point: this job's whole claim is that a FRESH CLONE gets what the builder had.
        run: pnpm install --frozen-lockfile

      - name: Playwright's Chromium, at the version `playwright` pins
        # The package is an exact 1.64.1 and the browser build is tied to it, so this
        # installs the one browser the suite was verified against. --with-deps brings the
        # shared libraries a bare runner does not have.
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run lint:es

      # The CSS half of the no-hard-coded-values rule. ESLint has no CSS parser here and
      # Tailwind v4 keeps its theme in CSS, so a rule that only read TypeScript would leave
      # the one format where colours actually live unchecked. Both readers share one pattern
      # list (tools/design-tokens/patterns.mjs) and both are proven on committed fixtures.
      - run: pnpm run lint:tokens

      # ⚠ THIS STEP WAS MISSING, and the gap is the reason the parity check below it now
      # exists. `lint:shell` was added to `pnpm gate` and to the `lint` script and never to
      # this job, so the $? hazard checker ran locally and not in CI -- which is the
      # "a green local gate and a green CI are two different claims" shape `R-126` is about,
      # one step over.
      #
      # tools/gate/bin/check-shell-evidence: every executable script must `set -o pipefail`
      # and no `$?` may be read after a pipe or a command substitution. Proven to fail on
      # tools/gate/fixtures/bad-evidence.sh.fixture.
      - run: pnpm run lint:shell

      - run: pnpm run format:check

      - run: pnpm run typecheck

      # §6.2's shared contracts, the TypeScript-sourced half. The token set lives in
      # TypeScript, so Node emits the CSS custom properties, Tailwind's @theme block, the TS
      # values, the contrast table in two formats, the ticket's evidence copy of it AND the
      # PHP config Filament consumes in 8b (D5) -- and this byte-diffs all of them against
      # what the source produces right now. The PHP-sourced half (the TS status mirror) is
      # `composer contracts:check` in the `gates` job above, because its source is the PHP
      # enum registry.
      #
      # ⚠ THAT LAST SENTENCE WAS FALSE WHEN IT WAS WRITTEN. `composer contracts:check` was in
      # `apps/api/bin/gate` and in NO step of the `gates` job, so this comment described a
      # control that did not exist -- found independently by both §11 reviewers. The step is
      # there now and `ci-parity.test.mjs` asserts the PHP gate and that job carry the same
      # steps, which is the mechanism that makes a comment like this one checkable.
      #
      # Each artefact is proven to fail on a deliberately stale file, with the exit code read
      # directly rather than through a pipe.
      - name: The generated token artefacts are not stale
        run: pnpm run tokens:check

      # §11.7's dependency clause, and it existed nowhere before this fix. The first run
      # returned five advisories -- 2 high, 3 moderate -- against a diff that adds 3,184
      # lockfile lines. `--audit-level low` so no severity is filtered out silently. The two
      # `overrides` in pnpm-workspace.yaml that close today's five carry their advisory ids
      # and the measurement that an override was the only instrument available (next@15.5.28
      # hard-pins postcss 8.4.31 and §1 locks Next 15).
      - name: Known CVEs in the dependency tree — §11.7
        run: pnpm run audit

      # §6's "unit coverage >= 90% on code this task added", with Vitest as ADR-003 names.
      # The thresholds are in vitest.config.ts, so a run below them exits non-zero here.
      - name: Vitest, with the >= 90% coverage thresholds
        run: pnpm exec vitest run --coverage

      # R-118's four computed-style clauses: a visible focus ring, a measured 44px target,
      # resolved contrast, and prefers-reduced-motion actually suppressing motion. All four
      # are computed styles and jsdom computes none of them, which is why they need a real
      # browser and why asserting them in Vitest would have been one of the weak assertions
      # R-118 exists to refuse.
      - name: The browser checks — R-118's four clauses
        run: pnpm exec playwright test

      - name: Both Next.js apps build
        run: |
          pnpm --filter @qrpager/web run build
          pnpm --filter @qrpager/site run build

      # A generated artefact or a build output left modified means something in this job
      # wrote to the tree, and a committed artefact that disagrees with its generator is the
      # quietest kind of wrong -- the whole reason the staleness checks exist. A clean tree
      # is the assertion that nothing slipped past them.
      - name: The working tree is unchanged by this job
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: The gate log, on failure
        if: failure()
        run: cat storage/logs/*.log 2>/dev/null || true

  runtime:
    name: FrankenPHP runtime — SIGTERM drain and a Redis outage
    runs-on: ubuntu-latest

    # Q7: "the drain proof runs in CI, not only locally." It cannot run in the gates job:
    # `php artisan test` has no FrankenPHP, no worker loop and no process to signal, so a
    # test there could only assert that the code which WOULD drain is present. Both
    # proofs here run against the pinned image -- which is what "proven against the
    # compiled app" means.
    #
    # One job for both, so the image is built once: the second proof reuses the layers of
    # the first.
    steps:
      - uses: actions/checkout@v5

      - name: Postgres and Redis, from the project's own compose file
        run: docker compose -f compose.yaml up -d --wait postgres redis

      # ONE place where freshness is established, and it is mechanical rather than
      # hoped for. Each proof builds the image itself so it can be run standalone, so
      # the job otherwise builds twice and the SECOND build is legitimately all-CACHED
      # -- which reads exactly like a stale cache in the log and is not one. Building
      # once here with --no-cache --pull means the proofs' own builds are cached off a
      # build that cannot be stale, and there is a single step to look at when asking
      # whether the image under test is the current Dockerfile.
      - name: Build the runtime from nothing, so no proof can run against a stale layer
        run: docker compose -f compose.yaml --profile app build --no-cache --pull frankenphp

      # Redis first: it leaves the cluster and Redis running, which the drain proof then
      # reuses. The other order would have the drain proof's cleanup remove the service
      # between them.
      - name: Redis is taken down and the API keeps serving
        run: apps/api/bin/redis-down-proof

      - name: SIGTERM drains in-flight requests and exits 0
        run: apps/api/bin/drain-proof

      - name: The runtime's logs, on failure
        if: failure()
        run: docker compose -f compose.yaml --profile app logs --no-color --tail 200 || true
