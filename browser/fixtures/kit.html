<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Kit — browser checks</title>
    <!--
      THE STYLESHEETS ARE SUBSTITUTED HERE, at the placeholder below, from the REAL files on
      disk at run time. No copy is committed beside this fixture: a resolved copy would be
      another artefact that could go stale, and a stale one would make these checks measure
      last week's CSS while reporting on today's.

      ⚠ AND THEY ARE SUBSTITUTED RATHER THAN INJECTED, WHICH IS A CORRECTION. The harness
      used `page.goto(file://…)` and then `page.addStyleTag()` per sheet. Under that, four
      `<button>` elements resolved to Chromium's UA colours -- `rgb(239,239,239)` on
      `rgb(0,0,0)` -- while the rules were present, parsed, matched (`el.matches()` true,
      `parsedOk` true in CDP) and the custom properties resolved. The same CSS and the same
      markup through `setContent` resolve correctly: `#FFFFFF` on `#0B6B4F`.

      The product CSS was never wrong; the harness was. That matters more than the symptom:
      a harness that reports a false FAILURE can equally report a false PASS, and these are
      the only checks in the project that can see a computed style at all.
    -->
    <!--STYLES-->
  </head>
  <body>
    <main id="main">
      <button class="qr-button qr-button--primary" id="primary">
        <span class="qr-button__label">Primary</span>
      </button>
      <button class="qr-button qr-button--secondary" id="secondary">
        <span class="qr-button__label">Secondary</span>
      </button>
      <button class="qr-button qr-button--quiet" id="quiet">
        <span class="qr-button__label">Quiet</span>
      </button>
      <button class="qr-button qr-button--danger" id="danger">
        <span class="qr-button__label">Danger</span>
      </button>

      <div class="qr-field">
        <label class="qr-field__label" for="name">Name</label>
        <input class="qr-field__input" id="name" />
      </div>

      <div class="qr-progress" id="progress">
        <span
          class="qr-progress__fill"
          id="fill"
          style="transform: scaleX(0.4); transform-origin: left"
        ></span>
      </div>

      <span class="qr-spinner" id="spinner" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </span>

      <p class="qr-timer"><span class="qr-timer__value" dir="ltr" id="timer">04:12</span></p>

      <span class="qr-badge" data-status="ready" data-tone="ready" id="badge">Ready</span>

      <section class="qr-card" id="card">
        <h2 class="qr-card__title">Card</h2>
        <p>Body</p>
      </section>

      <section class="qr-ready" id="ready" data-state="fresh">
        <h1 class="qr-ready__heading" id="ready-heading">Your order is ready</h1>
        <p class="qr-ready__reference" id="ready-reference" dir="ltr">A-114</p>
        <p class="qr-ready__instruction" id="ready-instruction">Come to the counter</p>
        <button class="qr-ready__acknowledge" id="ready-ack">On my way</button>
      </section>
    </main>
  </body>
</html>
